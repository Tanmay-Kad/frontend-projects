<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="icon" href="assets/logo.png">
    <title>Spotify - Web Player: Music for everyone</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="main">
        <div class="top-navbar">
            <div class="top-logo-home">
                <img src="assets/logo.png" alt="Nav-logo">
                <i class="fa-solid fa-house" id="icon1"></i>
            </div>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="What do you want to play?" >
                <i class="fa-solid fa-window-maximize"></i>
            </div>

            <div class="install-buttons">
                <button type="button" class="exp-btn1">Explore Premium</button>
                <button type="button" class="instll-btn1"> <i class="fa-solid fa-circle-arrow-down"></i>Install App</button>
                <i class="fa-regular fa-bell nav-icons"></i>
                <i class="fa-solid fa-users nav-icons"></i>
                <i class="fa-solid fa-user nav-icons" id="user-icon"></i>
            </div>
        </div>


        <div class="left-sidebar">
            <div class="your-library">
                <p>Your Library</p>
                <button type="button"><i class="fa-solid fa-plus"></i>Create</button>
                <i class="fa-solid fa-up-right-and-down-left-from-center extract-bar"></i>
            </div>
            
            <div class="artist">
                <button type="button" class="artists-btn">Artists</button>
            </div>

            <div class="recent-leftsidebar">
                <i class="fa-solid fa-magnifying-glass left-search"></i>
                <p>Recents<i class="fa-solid fa-list"></i></p>
            </div>

            <div class="albums">
                <div class="liked-songs albums-inner">
                    <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8470d229cb865e8d81cdce0889" alt="liked songs" style="border-radius: 0.8rem">
                    <div class="inner-box1">
                        <p style="margin-top: 1rem; font-weight: 500;">Liked Songs</p>
                        <p style="margin-top: -0.6rem; font-size: 0.9rem;">Playlist . 29 Songs</p>
                    </div>
                </div>

                <div class="atif-aslam albums-inner">
                    <img src="https://i.scdn.co/image/ab6761610000e5ebc40600e02356cc86f0debe84" alt="atif aslam" style="border-radius: 50%;">
                    <div class="inner-box2">
                        <p style="margin-top: 1rem; font-weight: 500;">Atif Aslam</p>
                        <p style="margin-top: -0.6rem; font-size: 0.9rem;">Artist</p>
                    </div>
                </div>

                <div class="darshan-raval albums-inner">
                    <img src="https://i.scdn.co/image/ab6761610000e5ebe971c19e2c773085fe2e4c32" alt="darshan raval" style="border-radius: 50%;">
                    <div class="inner-box3">
                        <p style="margin-top: 1rem; font-weight: 500">Darshan Raval</p>
                        <p style="margin-top: -0.6rem; font-size: 0.9rem;">Artist</p>
                    </div>
                </div>

                <div class="b-praak albums-inner">
                    <img src="https://i.scdn.co/image/ab6761610000e5eb0e03d94a7d567c5d4f73d3ed" alt="b praak" style="border-radius: 50%;">
                    <div class="inner-box4">
                        <p style="margin-top: 1rem; font-weight: 500;">B Praak</p>
                        <p style="margin-top: -0.6rem; font-size: 0.9rem;">Artist</p>
                    </div>
                </div>

                <div class="arijit-singh albums-inner">
                    <img src="https://i.scdn.co/image/ab6761610000e5eb5ba2d75eb08a2d672f9b69b7" alt="arijit singh" style="border-radius: 50%;">
                    <div class="inner-box5">
                        <p style="margin-top: 1rem; font-weight: 500;">Arijit Singh</p>
                        <p style="margin-top: -0.6rem; font-size: 0.8rem;">Artist</p>
                    </div>
                </div>
            </div>
        </div>


        <div class="main-content">
            <div class="main-content-navbar">
                <button type="button" class="all-btn">All</button>
                <button type="button">Music</button>
                <button type="button">Podcasts</button>
            </div>

            <div class="main-content-cards">
                <div class="liked">
                    <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8470d229cb865e8d81cdce0889" alt="liked-songs">
                </div>
                <div class="thodi-si-daru"></div>
                <div class="atif"></div>
                <div class="peaky-blinder"></div>
                <div class="desi-boys"></div>
                <div class="bollywood"></div>
                <div class="trending-now"></div>
                <div class="mega-punjabi"></div>
            </div>
        </div>
        <div class="right-sidebar">Right side bar</div>
        <div class="music-player">Music player</div>
    </div>
    
</body>
</html>
