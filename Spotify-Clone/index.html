<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="icon" href="assets/logo.png">
    <title>Spotify - Web Player: Music for everyone</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="main">
        <div class="top-navbar">
            <div class="top-logo-home">
                <img src="assets/logo.png" alt="Nav-logo">
                <i class="fa-solid fa-house" id="icon1"></i>
            </div>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="What do you want to play?" >
                <i class="fa-solid fa-window-maximize"></i>
            </div>

            <div class="install-buttons">
                <button type="button" class="exp-btn1">Explore Premium</button>
                <button type="button" class="instll-btn1"> <i class="fa-solid fa-circle-arrow-down"></i>Install App</button>
                <i class="fa-regular fa-bell nav-icons"></i>
                <i class="fa-solid fa-users nav-icons"></i>
                <i class="fa-solid fa-user nav-icons" id="user-icon"></i>
            </div>
        </div>


        <div class="left-sidebar">
            <div class="your-library">
                <p>Your Library</p>
                <button type="button"><i class="fa-solid fa-plus"></i>Create</button>
                <i class="fa-solid fa-up-right-and-down-left-from-center extract-bar"></i>
            </div>
            
            <div class="artist">
                <button type="button" class="artists-btn">Artists</button>
            </div>

            <div class="recent-leftsidebar">
                <i class="fa-solid fa-magnifying-glass left-search"></i>
                <p>Recents<i class="fa-solid fa-list"></i></p>
            </div>

            <div class="albums">
                <div class="liked-songs">
                    <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8470d229cb865e8d81cdce0889" alt="liked songs">
                    <div class="inner-box1">
                        <p style="margin-top: 1rem;">Liked Songs</p>
                        <p style="margin-top: -0.6rem; font-size: 0.8rem;">Playlist . 29 Songs</p>
                    </div>
                </div>

                <div class="atif-aslam">
                    <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8470d229cb865e8d81cdce0889" alt="liked songs">
                    <div class="inner-box2">
                        <p style="margin-top: 1rem;">Liked Songs</p>
                        <p style="margin-top: -0.6rem; font-size: 0.8rem;">Playlist . 29 Songs</p>
                    </div>
                </div>

                <div class="darshan-raval">
                    <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8470d229cb865e8d81cdce0889" alt="liked songs">
                    <div class="inner-box3">
                        <p style="margin-top: 1rem;">Liked Songs</p>
                        <p style="margin-top: -0.6rem; font-size: 0.8rem;">Playlist . 29 Songs</p>
                    </div>
                </div>

                <div class="b-praak">
                    <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8470d229cb865e8d81cdce0889" alt="liked songs">
                    <div class="inner-box4">
                        <p style="margin-top: 1rem;">Liked Songs</p>
                        <p style="margin-top: -0.6rem; font-size: 0.8rem;">Playlist . 29 Songs</p>
                    </div>
                </div>

                <div class="arijit-singh">
                    <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8470d229cb865e8d81cdce0889" alt="liked songs">
                    <div class="inner-box5">
                        <p style="margin-top: 1rem;">Liked Songs</p>
                        <p style="margin-top: -0.6rem; font-size: 0.8rem;">Playlist . 29 Songs</p>
                    </div>
                </div>
            </div>
        </div>


        <div class="main-content">Main Content</div>
        <div class="right-sidebar">Right side bar</div>
        <div class="music-player">Music player</div>
    </div>
    
</body>
</html>
