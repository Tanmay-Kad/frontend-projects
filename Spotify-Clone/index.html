<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="icon" href="assets/logo.png">
    <title>Spotify - Web Player: Music for everyone</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="top-navbar">
            <div class="top-logo-home">
                <img src="assets/logo.png" alt="Nav-logo">
                <i class="fa-solid fa-house" id="icon1"></i>
            </div>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="What do you want to play?" >
                <i class="fa-solid fa-window-maximize"></i>
            </div>

            <div class="install-buttons">
                <button type="button" class="exp-btn1">Explore Premium</button>
                <button type="button" class="instll-btn1"><i class="fa-solid fa-circle-arrow-down"></i>Install App</button>
                <i class="fa-regular fa-bell"></i>
                <i class="fa-solid fa-users"></i>
                <i class="fa-solid fa-user"></i>
            </div>

        </div>
        <div class="left-sidebar">Left side bar</div>
        <div class="main-content">Main Content</div>
        <div class="right-sidebar">Right side bar</div>
        <div class="music-player">Music player</div>
    </div>
    
</body>
</html>
